# TrainingHub backend (Fastify + Prisma).
#
# Runs on the home server "joaquinserver":
#   - LAN:       192.168.1.98          (SSH context `docker-lan`)
#   - Tailscale: 100.124.208.26        (SSH context `docker-ts`)
#
# PostgreSQL runs on the same host, published on loopback only (127.0.0.1:5434;
# compose in /home/joaquin/docker_composes/postgresql on the server).
#
# `network_mode: host` makes the container share the host network namespace so:
#   - it reaches PostgreSQL on the host loopback (DATABASE_URL -> 127.0.0.1:5434)
#   - it is reachable over Tailscale at https://joaquinserver.tail644a1a.ts.net:8443
#
# DATABASE_URL is read from apps/api/.env (gitignored, never baked into the image).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: traininghub-api:latest
    container_name: traininghub-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
