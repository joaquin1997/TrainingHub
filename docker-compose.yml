# TrainingHub backend (Fastify + Prisma).
#
# Linux host-network deployment template. Expects PostgreSQL already reachable
# from that host; DATABASE_URL and JWT_SECRET are loaded at runtime.
# See docs/deployment.md for the ordered auth/data rollout.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: traininghub-api:latest
    container_name: traininghub-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
